<!-- Planet Summary Statistics Card -->
<section class="planet-details">
    <div class="stats-card">
        <div class="main-stats">
            <div class="stat-item">
                <span class="label">Gravity</span>
                <span id="stat-gravity" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Mass</span>
                <span id="stat-mass" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Period</span>
                <span id="stat-period" class="value">0</span>
            </div>
        </div>
        
        <div class="secondary-stats">
            <div class="stat-item">
                <span class="icon">🌡️</span> 
                <span id="stat-temp" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="icon">🌙</span> 
                <span id="stat-moons" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="icon">⚪</span> 
                <span id="stat-diameter" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="icon">⚙️</span> 
                <span id="stat-rotation" class="value">0</span>
            </div>
        </div>
    </div>
</section>

<!-- Planetary Facts Table Section -->
<section class="facts-section">
    <h2>Planetary Facts at a Glance</h2>
    <p>Below is a comparative table of major planets in our solar system.</p>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Name</th>
                    <th>Mass (10 24kg)</th>
                    <th>Diameter (km)</th>
                </tr>
            </thead>
            <tbody id="planet-table-body">
                <!-- This part will be filled by JavaScript -->
            </tbody>
        </table>
    </div>
</section>
