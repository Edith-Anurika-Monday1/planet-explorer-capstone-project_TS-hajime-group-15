<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Explorer - Theme Toggle</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <main>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <span id="theme-label">DARK</span>

        <svg
          id="theme-icon"
          class="theme-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M21 14.2A8.5 8.5 0 0 1 1 9.8 3 8.8 0 1 0 21 14.2Z" />
        </svg>
      </button>
    </main>
  </body>
</html>
