<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <section class="planet-hero">
      <div class="planet-container">
        <!-- left hand side -->
        <div class="hero-left-side">
          <img id="planet-image" src="images/Profile Picture.png" alt="image of the planet">
        </div>

        <!-- right hand side -->
        <div class="hero-right-side">
          <h1 id="planet-name">Earth</h1>
          <span id="planet-type">Terrestrial</span>
          <p id="planet-description">The only known planet to support life, with liquid water on its surface.</p>

          <div class="planet-stats">
            <!-- planet statistics -->
            <div class="stats">
              <span class="stat-label">Gravity</span>
              <span id="planet-gravity" class="stat-value">9.8</span>
            </div>

            <div class="stats">
              <span class="stat-label">Mass</span>
              <span id="planet-mass" class="stat-value">0.00315</span>
            </div>

            <div class="stats">
              <span class="stat-label">Period</span>
              <span id="planet-period" class="stat-value">365</span>
            </div>
          </div>

          <div class="planet-metrics">

        </div>
      </div>  
    </section>
  </main>
</body>
